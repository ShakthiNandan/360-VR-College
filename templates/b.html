<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>360 VR Navigation</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    .controls-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      padding: 12px;
      border-radius: 50px;
      color: white;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 15px;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      pointer-events: auto;
    }

    .control-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 5px;
    }

    .control-item label {
      display: none;
    }

    .control-item button {
      padding: 8px 12px;
      border: none;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      pointer-events: auto;
      font-size: 14px;
      min-width: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .control-item button:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .control-item input[type="range"] {
      width: 80px;
      height: 4px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      outline: none;
      pointer-events: auto;
    }

    .control-item input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .control-item input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.1);
    }

    .loading-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(0, 0, 0, 0.2);
      z-index: 10000;
      display: none;
      pointer-events: none;
    }

    .loading-progress {
      width: 0%;
      height: 100%;
      background: #4CAF50;
      transition: width 0.3s ease;
    }

    .a-loader-title {
      display: none !important;
    }

    /* Mobile Styles */
    @media (max-width: 768px) {
      .controls-container {
        bottom: 10px;
        padding: 8px;
        gap: 10px;
      }

      .control-item button {
        padding: 6px 10px;
        font-size: 12px;
        min-width: 35px;
      }

      .control-item input[type="range"] {
        width: 60px;
      }

      .control-item input[type="range"]::-webkit-slider-thumb {
        width: 10px;
        height: 10px;
      }
    }

    /* Small Mobile Styles */
    @media (max-width: 480px) {
      .controls-container {
        padding: 6px;
        gap: 8px;
      }

      .control-item button {
        padding: 5px 8px;
        font-size: 11px;
        min-width: 30px;
      }

      .control-item input[type="range"] {
        width: 50px;
      }
    }

    /* VR Mode Styles */
    .a-enter-vr-button {
      background: rgba(0, 0, 0, 0.7) !important;
      backdrop-filter: blur(5px) !important;
      border-radius: 25px !important;
      padding: 8px 16px !important;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    }

    .a-enter-vr-button:hover {
      background: rgba(0, 0, 0, 0.8) !important;
    }
  </style>
  <script>
    let currentScene = null;
    let scenesData = {};
    let isHighRes = false;
    let isMuted = false;

    // Function to check that all hotspot target paths exist in the JSON
    function validatePaths(scenes) {
      for (const [sceneId, sceneData] of Object.entries(scenes)) {
        for (const hotspot of sceneData.hotspots) {
          if (scenes.hasOwnProperty(hotspot.target)) {
            //console.log(`Path from ${sceneId} to ${hotspot.target} exists.`);
          } else {
            //console.warn(`Path from ${sceneId} to ${hotspot.target} does NOT exist!`);
          }
        }
      }
    }

    // Handle hotspot clicks: log details and switch scene if needed
    function handleHotspotClick(target, fromScene, direction) {
      //console.log(`Hotspot clicked in scene ${fromScene}: target = ${target}, direction = ${direction}`);
      if (target === currentScene) {
        //console.log("Already in this scene:", target);
      } else {
        //console.log("Moving from", currentScene, "to", target);
        loadScene(target);
      }
    }

    // Change the scene by removing old scene containers and adding the new one
    function loadScene(sceneId) {
      const aScene = document.querySelector("a-scene");
      // Remove all existing scene containers
      const existingScenes = aScene.querySelectorAll("a-entity[id]");
      existingScenes.forEach(el => el.parentNode.removeChild(el));

      // Create the new scene container if data exists for it
      if (scenesData.hasOwnProperty(sceneId)) {
        const newSceneContainer = createSceneContainer(sceneId, scenesData[sceneId]);
        aScene.appendChild(newSceneContainer);
        currentScene = sceneId;
        //console.log("Current scene is now:", currentScene);
      } else {
        //console.error("Scene not found in scenesData:", sceneId);
      }
    }

    // Old mapping configuration (used for scenes with y = 1 or y >= 6)
    const oldPositions = {
      left:  "-2 1 -3",
      right: "2 1 -3",
      up:    "0 2 -3",
      down:  "0 -1 -3"
    };

    // New mapping configuration (used for scenes with y values 2 to 5)
    const newPositions = {
      up:    "3 0 -4",
      down:  "-3 0 -4",
      left:  "0 0 -6",
      right: "0 0 -2"
    };

    // Helper to determine hotspot positions based on direction and scene ID.
    // For scene "2_6": swap left/right only.
    // For scene "5_6": swap left with right and up with down.
    // Otherwise, use standard logic.
    function getHotspotPosition(direction, sceneId) {
      if (sceneId === "2_6") {
        // Swap left and right only, use oldPositions
        const swapMapping = {
          left:  oldPositions["up"],
          right: oldPositions["down"],
          up:    oldPositions["right"],
          down:  oldPositions["left"]
        };
        return swapMapping[direction] || "0 1 -3";
      } else if (sceneId === "5_3") {
        const mapping = {
          left:  newPositions["right"],
          right: newPositions["left"],
          up:    newPositions["down"],
          down:  newPositions["up"]
        };
        return mapping[direction] || "0 0 -4";
      }else if (sceneId === "5_5") {
        const mapping = {
          left:  newPositions["right"],
          right: newPositions["left"],
          up:    newPositions["down"],
          down:  newPositions["up"]
        };
        return mapping[direction] || "0 0 -4";
      }else if (sceneId === "3_6") {
        const mapping = {
          left:  newPositions["left"],
          right: newPositions["right"],
          up:    newPositions["up"],
          down:  newPositions["down"]
        };
        return mapping[direction] || "0 0 -4";
      }
      else if (sceneId === "5_6") {
        // Swap left with right and up with down
        const swapMapping = {
          left:  oldPositions["right"],
          right: oldPositions["left"],
          up:    oldPositions["down"],
          down:  oldPositions["up"]
        };
        return swapMapping[direction] || "0 1 -3";
      } else {
        const parts = sceneId.split("_");
        if (parts.length === 2) {
          const y = parseInt(parts[1], 10);
          if (y === 1 || y >= 6) {
            return oldPositions[direction] || "0 1 -3";
          } else {
            return newPositions[direction] || "0 0 -4";
          }
        }
        return "0 1 -3"; // default fallback
      }
    }

    // Create a scene container (panorama and its hotspots) dynamically for a given scene
    function createSceneContainer(sceneId, sceneData) {
      const sceneContainer = document.createElement("a-entity");
      sceneContainer.setAttribute("id", sceneId);

      // Create the sky (panorama background)
      const skyEl = document.createElement("a-sky");
      // Use high or low res image based on current setting
      const imagePath = isHighRes ? 
        sceneData.image.replace('/low_res/', '/panoramas/') : 
        sceneData.image;
      skyEl.setAttribute("src", imagePath);
      sceneContainer.appendChild(skyEl);

      // Create each hotspot for the scene
      for (const hotspot of sceneData.hotspots) {
        const linkEl = document.createElement("a-entity");
        linkEl.setAttribute("geometry", "primitive: plane; height: 0.5; width: 1");
        linkEl.setAttribute("material", "color: red; opacity: 0.8");
        // Use sceneId to determine the hotspot's position mapping
        linkEl.setAttribute("position", getHotspotPosition(hotspot.direction, sceneId));
        linkEl.setAttribute("look-at", "[camera]");
        // Mark the entity as raycastable for cursor interactions
        linkEl.setAttribute("data-raycastable", "");
        linkEl.classList.add("clickable");
        // Log hotspot info and handle click events
        linkEl.addEventListener("click", () => {
          handleHotspotClick(hotspot.target, sceneId, hotspot.direction);
        });
        sceneContainer.appendChild(linkEl);
      }
      return sceneContainer;
    }

    // Load scenes from JSON and start with the first scene
    async function loadScenes() {
      try {
        const response = await fetch("/static/scenes.json");
        scenesData = await response.json();
        // Validate all hotspot paths
        validatePaths(scenesData);
        // Load the first scene by default
        const firstScene = Object.keys(scenesData)[0];
        loadScene(firstScene);
      } catch (error) {
        console.error("Error loading scenes:", error);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadScenes();
      
      // Initialize audio controls
      const audio = document.getElementById('backgroundMusic');
      const muteToggle = document.getElementById('muteToggle');
      const volumeSlider = document.getElementById('volumeSlider');
      const resolutionToggle = document.getElementById('resolutionToggle');
      const loadingBar = document.querySelector('.loading-bar');
      const loadingProgress = document.querySelector('.loading-progress');

      // Set initial volume
      audio.volume = 0.5; // 50% volume

      // Start playing audio with user interaction
      function startAudio() {
        audio.play().then(() => {
          console.log("Audio started playing successfully");
        }).catch(error => {
          console.error("Audio autoplay failed:", error);
          // Try to play again on any user interaction
          document.addEventListener('click', () => {
            audio.play().then(() => {
              console.log("Audio started playing after user interaction");
            }).catch(err => console.error("Audio play failed after user interaction:", err));
          }, { once: true });
        });
      }

      // Start audio when the page loads
      startAudio();

      // Mute toggle
      muteToggle.addEventListener('click', () => {
        isMuted = !isMuted;
        audio.muted = isMuted;
        muteToggle.textContent = isMuted ? '🔇' : '🔊';
        console.log("Audio muted:", isMuted);
      });

      // Volume control
      volumeSlider.addEventListener('input', (e) => {
        const volume = e.target.value / 100;
        audio.volume = volume;
        console.log("Audio volume set to:", volume);
      });

      // Resolution toggle
      resolutionToggle.addEventListener('click', async () => {
        isHighRes = !isHighRes;
        resolutionToggle.textContent = isHighRes ? 'High Res' : 'Low Res';
        
        // Show loading bar
        loadingBar.style.display = 'block';
        loadingProgress.style.width = '0%';
        
        // Reload current scene with new resolution
        if (currentScene) {
          loadScene(currentScene);
        }
        
        // Hide loading bar after a short delay
        setTimeout(() => {
          loadingBar.style.display = 'none';
        }, 500);
      });
    });
  </script>
</head>
<body>
  <div class="controls-container">
    <div class="control-item">
      <label>Resolution:</label>
      <button id="resolutionToggle">Low Res</button>
    </div>
    <div class="control-item">
      <label>Audio:</label>
      <button id="muteToggle">🔊</button>
    </div>
    <div class="control-item">
      <label>Volume:</label>
      <input type="range" id="volumeSlider" min="0" max="100" value="50">
    </div>
  </div>
  <div class="loading-bar">
    <div class="loading-progress"></div>
  </div>
  <audio id="backgroundMusic" loop>
    <source src="{{ url_for('static', filename='music/background.mp3') }}" type="audio/mpeg">
  </audio>

  <a-scene>
    <a-camera position="0 1.6 0">
      <a-cursor></a-cursor>
    </a-camera>
  </a-scene>
</body>
</html>
