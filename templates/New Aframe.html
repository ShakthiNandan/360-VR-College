<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>360 VR Navigation</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script>
        let currentScene = null;

async function loadScenes() {

    try {
        const response = await fetch("/static/scenes.json");
        if (!response.ok) throw new Error("Failed to load scenes.");
        const scenes = await response.json();
        console.log("Loaded scenes:", scenes); // Check if "2_1" → "3_1" is correct

        const sceneEl = document.querySelector("a-scene");

        for (const [id, sceneData] of Object.entries(scenes)) {
            // Create scene container
            const sceneContainer = document.createElement("a-entity");
            sceneContainer.id = id;
            sceneContainer.setAttribute("visible", "false");

            // Create sky entity
            const skyEl = document.createElement("a-sky");
            skyEl.setAttribute("src", sceneData.image);
            sceneContainer.appendChild(skyEl);

            // Create navigation hotspots
            for (const hotspot of sceneData.hotspots) {
                const linkEl = createHotspot(hotspot);
                sceneContainer.appendChild(linkEl);
            }

            sceneEl.appendChild(sceneContainer);
        }

        // Show the first scene by default
        const firstScene = Object.keys(scenes)[0];
        changeScene(firstScene);
    } catch (error) {
        console.error("Error loading scenes:", error);
    }
}

function createHotspot(hotspot) {
    const linkEl = document.createElement("a-entity");
    linkEl.setAttribute("geometry", "primitive: plane; height: 0.5; width: 1");
    linkEl.setAttribute("material", "color: red; opacity: 0.8");
    linkEl.setAttribute("position", getHotspotPosition(hotspot.direction));
    linkEl.setAttribute("look-at", "[camera]");
    linkEl.classList.add("clickable");
    linkEl.addEventListener("click", () => changeScene(hotspot.target));

    return linkEl;
}

function getHotspotPosition(direction) {
    const positions = {
        "left": "-2 1 -3",
        "right": "2 1 -3",
        "up": "0 2 -3",
        "down": "0 -1 -3"
    };
    return positions[direction] || "0 1 -3";
}

function changeScene(sceneId) {
    console.log("Switching to scene:", sceneId);

    if (currentScene) {
        const prevSceneEl = document.getElementById(currentScene);
        if (prevSceneEl) prevSceneEl.setAttribute("visible", "false");
    }

    const newSceneEl = document.getElementById(sceneId);
    if (newSceneEl) {
        newSceneEl.setAttribute("visible", "true");
        currentScene = sceneId;
    } else {
        console.error("Scene not found:", sceneId);
    }
}

document.addEventListener("DOMContentLoaded", loadScenes);
</script>
</head>
<body>
    <a-scene>
        <a-camera position="0 1.6 0">
            <a-cursor></a-cursor>
        </a-camera>
    </a-scene>
</body>
</html>
