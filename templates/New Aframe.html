<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>360 VR Navigation</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script>
        async function loadScenes() {
            const response = await fetch("/static/scenes.json");
            const scenes = await response.json();
            const sceneEl = document.querySelector("a-scene");
            
            for (const [id, sceneData] of Object.entries(scenes)) {
                // Create an entity for the panorama
                let skyEl = document.createElement("a-sky");
                skyEl.setAttribute("id", id);
                skyEl.setAttribute("src", sceneData.image);
                skyEl.setAttribute("visible", "false");
                sceneEl.appendChild(skyEl);

                // Create navigation hotspots
                sceneData.hotspots.forEach(hotspot => {
                    let linkEl = document.createElement("a-entity");
                    linkEl.setAttribute("geometry", "primitive: plane; height: 1; width: 2");
                    linkEl.setAttribute("material", "color: red; opacity: 0.8");
                    linkEl.setAttribute("position", getHotspotPosition(hotspot.direction));
                    linkEl.setAttribute("look-at", "[camera]");
                    linkEl.setAttribute("clickable", "");
                    linkEl.addEventListener("click", () => changeScene(hotspot.target));
                    skyEl.appendChild(linkEl);
                });
            }

            // Show the first scene
            changeScene(Object.keys(scenes)[0]);
        }

        function getHotspotPosition(direction) {
            const positions = {
                "left": "-3 1 -5",
                "right": "3 1 -5",
                "up": "0 3 -5",
                "down": "0 -1 -5"
            };
            return positions[direction] || "0 1 -5";
        }

        function changeScene(sceneId) {
            document.querySelectorAll("a-sky").forEach(el => el.setAttribute("visible", "false"));
            document.getElementById(sceneId).setAttribute("visible", "true");
        }

        document.addEventListener("DOMContentLoaded", loadScenes);
    </script>
</head>
<body>
    <a-scene>
        <a-camera position="0 1.6 0">
            <a-cursor></a-cursor>
        </a-camera>
    </a-scene>
</body>
</html>
